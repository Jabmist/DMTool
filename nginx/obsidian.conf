limit_req_zone $binary_remote_addr zone=obsidian_auth:10m rate=20r/m;

server {
    listen 80;
    server_name your.domain.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name your.domain.com;

    ssl_certificate     /etc/letsencrypt/live/your.domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your.domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Serve built React app
    root /opt/obsidian/app/client/dist;
    index index.html;

    # Rate-limit registration and login at the nginx layer
    location ~ ^/api/auth/(register|login) {
        limit_req zone=obsidian_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    # WebSocket upgrade
    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # API
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        client_max_body_size 55M;
    }

    # SPA fallback — all non-asset routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
